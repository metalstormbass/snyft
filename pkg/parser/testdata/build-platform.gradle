plugins {
    id 'java'
    id 'org.springframework.boot' version '3.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // BOM import via platform()
    implementation platform('org.springframework.boot:spring-boot-dependencies:3.0.0')

    // Dependencies managed by the BOM (no version)
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.core:jackson-databind'

    // Dependency with explicit version
    implementation 'com.google.guava:guava:31.1-jre'

    // BOM import via enforcedPlatform()
    implementation enforcedPlatform("org.junit:junit-bom:5.9.0")

    // Test deps (should be excluded)
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.0.0'
}
