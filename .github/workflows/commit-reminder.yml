name: Commit Reminder

on:
  schedule:
    # Run every hour during work hours (9 AM - 6 PM UTC)
    - cron: '0 9-18 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check-branches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for stale branches
        run: |
          echo "Checking for branches with uncommitted work..."
          git fetch --all

          # List all remote branches
          for branch in $(git branch -r | grep -v HEAD | sed 's/origin\///'); do
            # Check last commit time
            LAST_COMMIT=$(git log -1 --format=%ct origin/$branch)
            NOW=$(date +%s)
            HOURS_AGO=$(( ($NOW - $LAST_COMMIT) / 3600 ))

            if [ $HOURS_AGO -gt 24 ]; then
              echo "⚠ Branch $branch: last commit $HOURS_AGO hours ago"
            fi
          done
